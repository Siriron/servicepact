name: ci
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "genlayer-test==0.29.2" genvm-linter
      - run: genvm-lint download --version v0.2.16
      - run: genvm-lint check contracts/service_pact.py
      - run: pytest tests -q -p no:cacheprovider
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
